syntax = "proto3";

package lab;

option go_package = "pkg/proto/lab";

// A lab order, as finance needs to see it.
//
// This is a billing projection, not the order. The lab owns the order and everything
// clinical about it; finance is told only what it needs to raise a charge and take payment.
// Results, specimens and reference ranges are deliberately absent — finance has no business
// holding a patient's creatinine, and a projection that carries it becomes a second copy of
// the record that nobody remembers to keep in step.
message LabOrderLine {
  uint32 id = 1;
  // Exactly one of these is set. A panel bills as one line at the panel's own price, which
  // is normally less than its members would come to individually.
  uint32 test_id = 2;
  uint32 panel_id = 3;
  // Code and name are copied rather than referenced, so a receipt reprinted next year says
  // what was actually charged for. Renaming a test in the catalogue must not rewrite
  // history on a document somebody has already paid against.
  string code = 4;
  string name = 5;
  double price = 6;
}

message LabOrder {
  uint32 id = 1;
  string order_number = 2;
  uint32 patient_id = 3;
  repeated LabOrderLine lines = 4;
  double total_price = 5;

  // Priority decides whether the collection gate can be walked past. STAT and urgent work
  // is drawn before payment and flagged for finance to chase, so a cashier seeing an
  // unpaid STAT order is looking at something already in progress, not something to hold.
  string priority = 6;

  // Who referred the patient. Carried for reporting and for the receipt, not for billing:
  // every order is paid for through the application whoever referred it, so none of these
  // changes whether payment is owed or whether the order appears on a cashier's list.
  uint32 organization_id = 7;
  uint32 referring_center_id = 8;
  uint32 insurance_id = 9;

  uint32 center_id = 10;
  uint32 ordered_by = 11;
  string ordered_at = 12;

  // Status carries cancellations. A cancelled order that was never collected should stop
  // being billable, and one already drawn should not.
  string status = 13;
  bool is_active = 14;
}

// A released lab result, as the patient's EMR needs it.
//
// The EMR's lab view was a manual entry form before the lab module existed. This turns it
// into a read projection: the lab owns the result, the EMR displays it, and nobody retypes
// a number that has already been verified twice.
//
// Sent per result rather than per report because that is the grain the EMR lists at, and
// because a report can be partially released — the renal panel today, histology next week.
message ReleasedLabResult {
  // ResultID is the lab's own id for the result. The EMR keys its projection on it so a
  // redelivered message updates the row rather than adding a second copy of the same test.
  uint32 result_id = 1;
  uint32 patient_id = 2;
  uint32 order_id = 3;
  string order_number = 4;

  string test_name = 5;
  string test_code = 6;
  // Value as it will be displayed. Already narrowed from whichever column the test reports
  // in, because the EMR shows a string and should not have to know the difference.
  string value = 7;
  string unit = 8;
  // ReferenceRange is the range that applied when the result was entered, not a live
  // lookup: a report reprinted next year must show what the value was judged against.
  string reference_range = 9;

  // Flag is the lab's own: N, H, L, HH, LL or A.
  string flag = 10;
  bool is_abnormal = 11;
  bool is_critical = 12;

  // SpecimenCollectedAt is when the patient's clock started, which is the date a clinician
  // reads the result against — not when the lab happened to finish it.
  string specimen_collected_at = 13;
  string released_at = 14;
  string performed_by = 15;
  string verified_by = 16;

  string comment = 17;
  // IsActive goes false if the result is later retracted, so the EMR can withdraw it
  // rather than leave a wrong value on a chart.
  bool is_active = 18;
}
