syntax = "proto3";

package proto;

option go_package = "pkg/proto/pdf";

message PaymentItem {
  string code = 1;
  string description = 2;
  int32 quantity = 3;
  string unitPrice = 4;
  string amount = 5;
}

message ReceiptData {
  string fileName = 1;
  string name = 2;
  string patientId = 3;
  string paymentDate = 4;
  string receiptNumber = 5;
  string paymentMethod = 6;
  string discount = 7;
  string subTotal = 8;
  string total = 9;
  repeated PaymentItem paymentItems = 10;
  uint32 id = 11;
  // Selects the header, footer and logo. Empty falls back to the default brand.
  string brandKey = 12;
}

message RequestFormData {
  uint32 id = 12;
  string patientName = 1;
  string sex = 2;
  string date = 3;
  string age = 4;
  string phoneNumber = 5;
  string address = 6;
  string requestingDoctor = 7;
  string requestingFacility = 8;
  string examination = 9;
  string query = 10;
  string fileName = 11;
  // Selects the header, footer and logo. Empty falls back to the default brand.
  string brandKey = 13;
}

message ReportData {
  uint32 id = 19;
  string name = 1;
  string dob = 2;
  string age = 3;
  string patientId = 4;
  string referringDoctor = 5;
  string referringFacility = 6;
  string detail = 7;
  string procedure = 8;
  string examinationDate = 9;
  string radiologist = 10;
  string verifiedAt = 11;
  string fileName = 12;
  string titleOnReport = 13;
  string impressions = 14;
  string findings = 15;
  string approvedBy = 16;
  string approverTitle = 17;
  bool withHeader = 18;
  string recommendations = 20;
  string Type = 21;
  string Weight = 22;
  string Height = 23;
  string BloodPressure = 24;
  string appendix = 25;
  // Selects the header, footer and logo. Empty falls back to the default brand.
  string brandKey = 26;
}

// One row of a released lab report.
message LabResultLine {
  string investigation = 1;
  string value = 2;
  string unit = 3;
  // The range that was applied when the result was entered, not a live lookup. May carry
  // newlines where a test bands by sex or age ("Female: 53 - 120\nMale: 71 - 140").
  string referenceInterval = 4;
  // N, H, L, HH, LL or A. Drives the marker printed beside the value.
  string flag = 5;
  bool isCritical = 6;
  string comment = 7;
  string method = 8;
}

message LabKeyValue {
  string label = 1;
  string value = 2;
}

// A titled block of label/value rows. Used by examinations that report two blocks side by
// side rather than one table, urine routine examination being the one everybody has seen:
// macroscopic findings on the left, microscopic on the right.
message LabSection {
  string title = 1;
  repeated LabKeyValue rows = 2;
}

// One panel, which is one page of the report.
message LabReportPanel {
  // Overrides the catalogue title when set.
  string title = 1;
  repeated LabResultLine lines = 2;
  // Free HTML printed under the table. Overrides the catalogue's standing notes when set.
  string interpretation = 3;
  // Histopathology and cytology, which report prose rather than rows.
  string narrative = 4;
  // Catalogue key: KFT, LFT, LIPID, HBA1C, HBSAG, PSA, CARDIAC, TROPONIN_I, TROPONIN_T,
  // URIC_ACID, URINE_RE, FBS. Selects the page layout and the standing reference material
  // that belongs to the examination rather than to the patient.
  string code = 5;
  // Overrides the catalogue layout when set: numeric, qualitative, three_column, paired,
  // marker or narrative.
  string layout = 6;
  repeated LabSection sections = 7;
  // The specimen this examination actually ran on. The report-level specimen lists every
  // specimen on the order, which is wrong on a page reporting one of them.
  string specimen = 8;
}

message LabReportData {
  uint32 id = 1;
  string fileName = 2;
  string pathNumber = 3;
  string patientName = 4;
  string patientId = 5;
  string age = 6;
  string sex = 7;
  string specimen = 8;
  string specimenDate = 9;
  string reportNumber = 10;
  // Set when the release covered only part of the order. Prints a banner saying so.
  bool isInterim = 11;
  string signedBy = 12;
  string releasedAt = 13;
  string referringDoctor = 14;
  string referringFacility = 15;
  repeated LabReportPanel panels = 16;
  // Selects the header, footer and logo. Empty falls back to the default brand.
  string brandKey = 17;
}

message PdfEvent {
  oneof event {
    ReceiptData receipt = 1;
    RequestFormData requestForm = 2;
    ReportData report = 3;
    LabReportData labReport = 4;
  }
}

message FileUploaded{
  string fileKey =1;
  uint32 id = 2;
}